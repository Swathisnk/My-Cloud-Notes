{% extends 'notes/base.html' %}
{% block title %}Login - CloudNote{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card glass-panel text-center">
            <div class="mb-4">
                <i class="bi bi-cloud-arrow-up-fill text-primary fs-1"></i>
                <h2 class="fw-bold mt-2">Welcome Back</h2>
                <p class="text-secondary small">Access and share your college notes securely</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="form-floating-custom text-start">
                    <label for="username"><i class="bi bi-person me-1"></i> Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required autofocus>
                </div>

                <div class="form-floating-custom text-start">
                    <label for="password"><i class="bi bi-lock me-1"></i> Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 mt-3" id="login-submit-btn">
                    Sign In
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary-subtle">
                <p class="text-secondary small mb-0">
                    New to CloudNote? <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Create a student account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
