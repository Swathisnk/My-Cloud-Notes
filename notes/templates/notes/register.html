{% extends 'notes/base.html' %}
{% block title %}Register Student - CloudNote{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card glass-panel text-center">
            <div class="mb-4">
                <i class="bi bi-cloud-arrow-up-fill text-primary fs-1"></i>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-secondary small">Join CloudNote to upload and download notes</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}" id="registration-form">
                {% csrf_token %}
                
                <div class="form-floating-custom text-start">
                    <label for="username"><i class="bi bi-person me-1"></i> Username</label>
                    <input type="text" name="username" id="username" placeholder="Choose a username" minlength="4" required>
                </div>

                <div class="form-floating-custom text-start">
                    <label for="email"><i class="bi bi-envelope me-1"></i> Student Email</label>
                    <input type="email" name="email" id="email" placeholder="student@college.edu" required>
                </div>

                <div class="form-floating-custom text-start">
                    <label for="password"><i class="bi bi-lock me-1"></i> Password</label>
                    <input type="password" name="password" id="password" placeholder="Create strong password" minlength="6" required>
                </div>

                <div class="form-floating-custom text-start">
                    <label for="confirm_password"><i class="bi bi-shield-check me-1"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 mt-3" id="register-submit-btn">
                    Register Account
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary-subtle">
                <p class="text-secondary small mb-0">
                    Already have an account? <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Sign In instead</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // Specific register form client-side matching validator
    document.getElementById('registration-form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
            e.preventDefault();
            // Call showToast if main.js is loaded
            if (typeof showToast === 'function') {
                showToast("Passwords do not match!", "danger");
            } else {
                alert("Passwords do not match!");
            }
        }
    });
</script>
{% endblock %}
